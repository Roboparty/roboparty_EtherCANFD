name: Build (Windows USB + EtherCAT)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # runs-on: windows-latest
    runs-on: ['self-hosted', 'n100']

    steps:
      - name: Checkout firmware source
        uses: actions/checkout@v4

      - name: Clone or update SDK environment
        run: |
          if (Test-Path C:\sdk_env) {
            git -C C:\sdk_env pull --ff-only --depth 1
            git -C C:\sdk_env submodule update --init --depth 1
          } else {
            git clone https://github.com/hpmicro/sdk_env.git --depth 1 --recurse-submodules C:\sdk_env
          }

      - name: Set environment
        run: |
          "HPM_SDK_BASE=C:\sdk_env\hpm_sdk" >> $env:GITHUB_ENV
          "GNURISCV_TOOLCHAIN_PATH=C:\sdk_env\toolchains\rv32imac_zicsr_zifencei_multilib_b_ext-win" >> $env:GITHUB_ENV
          "HPM_SDK_TOOLCHAIN_VARIANT=" >> $env:GITHUB_ENV
          "SSC_TOOL_DIR=C:\Program Files (x86)\Beckhoff\EtherCAT Slave Stack Code Tool" >> $env:GITHUB_ENV
          "C:\sdk_env\tools\cmake\bin" >> $env:GITHUB_PATH
          "C:\sdk_env\tools\ninja" >> $env:GITHUB_PATH
          "C:\sdk_env\tools\python3" >> $env:GITHUB_PATH

      - name: Configure CMake
        run: |
          cmake -B build -S . -G "Ninja" -DBOARD=ethercanfd -DENABLE_ETHERCAT=ON

      - name: Build firmware
        run: |
          cmake --build build --parallel

      - name: Stage artifacts
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\output\ethercanfd.bin dist\ethercanfd-windows-usb-ecat.bin
          Get-ChildItem build\output\ethercanfd_v*.bin | ForEach-Object {
            $name = $_.Name -replace '^ethercanfd_', 'ethercanfd-windows-usb-ecat_'
            Copy-Item $_.FullName (Join-Path dist $name)
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ethercanfd-windows-usb-ecat
          path: dist/*.bin

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          name: ${{ github.ref_name }}
          generate_release_notes: true
