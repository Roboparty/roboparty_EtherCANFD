name: Build (Linux)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone or update SDK
        run: |
          if [ -d ~/sdk_env ]; then
            git -C ~/sdk_env pull --ff-only --depth 1
            git -C ~/sdk_env submodule update --init --depth 1 hpm_sdk
          else
            git clone https://github.com/hpmicro/sdk_env.git --depth 1 ~/sdk_env
            cd ~/sdk_env
            git submodule update --init --depth 1 hpm_sdk
          fi
          git -C ~/sdk_env/hpm_sdk fetch origin main --depth 1
          git -C ~/sdk_env/hpm_sdk checkout --force -B main origin/main

      - name: Download toolchain
        run: |
          TC_DIR=~/sdk_env/toolchains/rv32imac_zicsr_zifencei_multilib_b_ext-linux
          if [ ! -d "$TC_DIR" ]; then
            cd ~/sdk_env/toolchains
            wget -q https://github.com/hpmicro/riscv-gnu-toolchain/releases/download/2023.10.18/rv32imac_zicsr_zifencei_multilib_b_ext-linux.tar.gz
            tar -zxf rv32imac_zicsr_zifencei_multilib_b_ext-linux.tar.gz
            rm rv32imac_zicsr_zifencei_multilib_b_ext-linux.tar.gz
          fi

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-jinja2 python3-yaml

      - name: Set env
        run: |
          echo "HPM_SDK_BASE=$HOME/sdk_env/hpm_sdk" >> "$GITHUB_ENV"
          echo "GNURISCV_TOOLCHAIN_PATH=$HOME/sdk_env/toolchains/rv32imac_zicsr_zifencei_multilib_b_ext-linux" >> "$GITHUB_ENV"
          echo "HPM_SDK_TOOLCHAIN_VARIANT=" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B build -S . -G Ninja -DBOARD=ethercanfd -DHPM_BUILD_TYPE=flash_xip -DENABLE_ETHERCAT=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/output/ethercanfd.bin dist/ethercanfd-linux-usb.bin
          for file in build/output/ethercanfd_v*.bin; do
            [ -e "$file" ] || continue
            name="$(basename "$file")"
            cp "$file" "dist/${name/ethercanfd_/ethercanfd-linux-usb_}"
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ethercanfd-linux-usb
          path: dist/*.bin

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true
