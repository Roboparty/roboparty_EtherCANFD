name: Build (Linux)

on:
  workflow_dispatch:

jobs:
  build:
    # runs-on: ubuntu-latest
    runs-on: ['self-hosted', 'a100']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone or update SDK
        run: |
          if [ -d ~/sdk_env ]; then
            git -C ~/sdk_env pull --ff-only --depth 1
            git -C ~/sdk_env submodule update --init --depth 1 hpm_sdk
          else
            git clone https://github.com/hpmicro/sdk_env.git --depth 1 ~/sdk_env
            cd ~/sdk_env
            git submodule update --init --depth 1 hpm_sdk
          fi

      - name: Download toolchain
        run: |
          TC_DIR=~/sdk_env/toolchains/rv32imac_zicsr_zifencei_multilib_b_ext-linux
          if [ ! -d "$TC_DIR" ]; then
            cd ~/sdk_env/toolchains
            wget -q https://github.com/hpmicro/riscv-gnu-toolchain/releases/download/2023.10.18/rv32imac_zicsr_zifencei_multilib_b_ext-linux.tar.gz
            tar -zxf rv32imac_zicsr_zifencei_multilib_b_ext-linux.tar.gz
            rm rv32imac_zicsr_zifencei_multilib_b_ext-linux.tar.gz
          fi

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip
          pip install pyyaml jinja2

      - name: Fix toolchain path
        run: sed -i 's/_b_ext-win/_b_ext-linux/' CMakeLists.txt

      - name: Set env
        run: echo "HPM_SDK_BASE=$HOME/sdk_env/hpm_sdk" >> $GITHUB_ENV

      - name: Configure
        run: cmake -G Ninja -DBOARD=ethercanfd -DHPM_BUILD_TYPE=flash_xip -B build

      - name: Build
        run: ninja -C build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ethercanfd-firmware
          path: build/output/ethercanfd*.bin

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/output/ethercanfd*.bin
          generate_release_notes: true
